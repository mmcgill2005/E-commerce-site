<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | RePlay</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<!-- top notification bar -->
    <div class="top-bar">
        Free Shipping on Orders Over $50
    </div>
<!-- main site navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">RePlay</div>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html" class="active">Products</a></li>
                <li><a href="resale.html">Resale</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
        </nav>
    </header>
<!-- products hero section -->
    <section class="products-hero">
        <div class="products-hero-content">
            <h1>Shop All Products</h1>
            <p>Browse sports gear, apparel, and equipment all in one place.</p>
        </div>
    </section>

    <section class="category-bar">
        <a href="#">Basketball</a>
        <a href="#">Football</a>
        <a href="#">Soccer</a>
        <a href="#">Baseball</a>
        <a href="#">Fitness</a>
    </section>
<!-- Product filtering controls -->
    <section class="filters">
        <select id="sportFilter">
            <option value="all">All Sports</option>
            <option value="basketball">Basketball</option>
            <option value="soccer">Soccer</option>
            <option value="football">Football</option>
            <option value="baseball">Baseball</option>
        </select>

        <select id="genderFilter">
            <option value="all">Gender</option>
            <option value="men">Men</option>
            <option value="women">Women</option>
            <option value="unisex">Unisex</option>
        </select>

        <select id="conditionFilter">
            <option value="all">Condition</option>
            <option value="new">Brand New</option>
            <option value="used">Used</option>
        </select>
    </section>
<!-- Product listing cards -->
   <section class="products-grid-section">
    <div class="products-grid"></div>
    </section>

    <footer>
        <p>&copy; 2026 Sports Gear Hub</p>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
